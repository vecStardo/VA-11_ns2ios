# Va11IOS：VA-11 HALL-A iOS 移植工程（无签名 .ipa 流水线 + 宿主核心接入）。
# 思路对齐 d2r-mobile 的 dm/ios：改写后的模块映像以内嵌汇编编进可执行文件（iOS 不允许运行期写代码页），
# 装载表/门表作为资源随包；宿主核心（loader / HLE 服务面 / 图形层）由 build.sh 从 dm/host/Makefile 展开后编进来，
# 前端（Sources/main.m）实现 front.h：EAGL 出图、触摸、软键盘、生命周期。图形走 EGL→EAGL 垫片（dm/host/hle_egl_ios.m）。
# Va11IOS: the VA-11 HALL-A iOS port project (unsigned .ipa pipeline + host core hookup).
# Approach aligned with d2r-mobile's dm/ios: rewritten module images are compiled into the executable as embedded
# assembly (iOS forbids writing code pages at run time), loader/gate tables ship as resources, and the host core
# (loader / HLE service surface / graphics layer) is compiled in from the expanded dm/host/Makefile by build.sh.
# The front end (Sources/main.m) implements front.h: EAGL output, touch, soft keyboard, lifecycle. Graphics go
# through the EGL→EAGL shim (dm/host/hle_egl_ios.m).
name: Va11IOS
options:
  bundleIdPrefix: local.va11
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO   # 无签名出包：结构由自签工具（AltStore/Sideloadly 等）补签 | unsigned build; structure is signed later by self-sign tools
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
configFiles:
  Debug: Gen/dm.xcconfig       # gen_embed.py 的 -segprot 链接参数 + gen_build_ios.py 的宿主构建输入（build.sh 生成）
  Release: Gen/dm.xcconfig
targets:
  Va11IOS:
    type: application
    platform: iOS
    sources:
      - path: Sources                         # 壳 + 前端（front.h 的 iOS 实现） | shell + front end (the iOS implementation of front.h)
      - path: Assets.xcassets                 # App 图标 + 启动画面底色/字标（gen_icon.py 生成） | app icon + launch screen colour/wordmark (generated by gen_icon.py)
      - path: Gen/src                         # 宿主核心源文件符号链接（gen_build_ios.py 从 Makefile 取） | symlinks to host core sources (taken from the Makefile by gen_build_ios.py)
      - path: Gen/main/main.c
        compilerFlags: "-Dmain=dm_main"       # 宿主入口改名，App 的 main 仍是壳的 | rename the host entry; the App's main stays the shell's
      - path: Gen/embed.S
        buildPhase: sources                   # 四个模块映像的内嵌汇编（__TEXT/__DM*W 段） | embedded assembly of the four module images
      - path: Resources/dm
        type: folder                          # 装载表/门表按原样进包（dm/ 子目录） | load/gate tables ship as-is (dm/ subdirectory)
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.va11.mobile
        PRODUCT_NAME: Va11IOS
        # 版本号由 build.sh 通过 xcodebuild 参数覆盖（MARKETING_VERSION / CURRENT_PROJECT_VERSION）；
        # 这里的值只是兜底默认，版本源头是 va11mobile/VERSION。
        # The version comes from build.sh via xcodebuild overrides; these are fallbacks, the source of truth is
        # va11mobile/VERSION.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: NO
        # 客体代码是 arm64：模拟器也只编 arm64（Apple 芯片 Mac），Intel 模拟器 x86_64 跑不了客体
        # The guest code is arm64: the simulator builds arm64 only (Apple silicon Macs); an Intel x86_64 simulator cannot run the guest
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        VALIDATE_PRODUCT: YES
